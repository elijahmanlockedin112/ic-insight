name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the extension will load unpacked
        run: node tools/check.mjs

      - name: Run the analysis tests
        run: node test/run.mjs

      - name: Build the release zip
        run: node tools/build-zip.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: ic-insight-unpacked
          path: |
            manifest.json
            src/
            icons/
