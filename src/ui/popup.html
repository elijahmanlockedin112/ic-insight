<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IC Insight</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { width: 340px; padding: 14px; }
    .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .head h1 { font-size: 16px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stats .stat .value { font-size: 19px; }
    .actions { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
    #progress { margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="head">
    <h1>IC Insight</h1>
    <span id="budget" class="small muted"></span>
  </div>

  <div id="status" class="notice info">Loading&hellip;</div>

  <div class="stats" id="stats" hidden>
    <div class="stat"><span class="value" id="gpa">&mdash;</span><span class="label">Term GPA</span></div>
    <div class="stat"><span class="value" id="courses">&mdash;</span><span class="label">Courses</span></div>
    <div class="stat"><span class="value" id="missing">&mdash;</span><span class="label">Missing</span></div>
  </div>

  <div id="gaps" class="small muted"></div>

  <div id="progress" class="notice info small"></div>

  <div class="actions">
    <button id="fetch" class="primary">Fetch my data</button>
    <button id="dashboard">Open dashboard</button>
    <div class="row">
      <button id="options" class="ghost grow">Settings</button>
      <button id="safety" class="ghost grow">Request log</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
